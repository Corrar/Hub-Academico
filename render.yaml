# Hub Acadêmico — serviço Python/FastAPI para homologação
# Este Blueprint não cria banco automaticamente: informe DATABASE_URL de um
# PostgreSQL isolado com TLS nas variáveis do serviço antes de aplicar.
services:
  - type: web
    name: hub-academico-api
    runtime: python
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: staging
      - key: STAGING_SYNTHETIC_DATA_ONLY
        value: "true"
      - key: WEB_SECURE_COOKIE
        value: "true"
      - key: WEB_ORIGINS
        sync: false
      - key: WEB_APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: STAGING_ACCESS_PASSWORD
        generateValue: true
      # Push: gere as chaves com `python -m app.cli vapid-keys` e cole como segredos.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: PUSH_DISPATCH_INTERVAL_SECONDS
        value: "60"
