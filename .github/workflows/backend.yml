name: Backend
on:
  push:
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  sqlite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pytest -q
      - run: ruff check . && ruff format --check .
      - run: node --check app/static/panel.js
      - run: alembic upgrade head && alembic check
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hub_test
          POSTGRES_PASSWORD: ephemeral-ci-password
          POSTGRES_DB: hub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hub_test -d hub_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://hub_test:ephemeral-ci-password@localhost:5432/hub_test
      DATABASE_URL: postgresql+psycopg://hub_test:ephemeral-ci-password@localhost:5432/hub_test
      APP_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pytest -q
      - run: alembic check
