<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #C8102E; text-decoration: none; }
    a:hover { color: #E11D2A; }
    .fx-scroll::-webkit-scrollbar { width: 0; height: 0; }
    button:focus-visible { outline: 2.5px solid #2E4756; outline-offset: 3px; }
  </style>
</helmet>

<div style="width:460px;height:844px;background:#F4F5F7;font-family:'Plus Jakarta Sans',system-ui,sans-serif;position:relative;overflow:hidden;display:flex;flex-direction:column;">

  <!-- cabeçalho fixo -->
  <div style="background:#2E4756;padding:60px 20px 0;flex-shrink:0;">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
      <button aria-label="Voltar para minhas turmas" style="width:44px;height:44px;border-radius:14px;border:none;background:rgba(255,255,255,.16);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <div style="flex:1;min-width:0;">
        <h1 style="font-size:21px;font-weight:800;color:#fff;margin:0;letter-spacing:-.5px;">Ciência de Dados</h1>
        <div style="font-size:12px;color:rgba(255,255,255,.72);font-weight:600;margin-top:2px;">CD · 3º semestre · 32 alunos</div>
      </div>
    </div>

    <!-- abas -->
    <div style="display:flex;gap:4px;">
      <sc-for list="{{ abas }}" as="ab" hint-placeholder-count="3">
        <button onClick="{{ ab.abrir }}" style="flex:1;min-height:46px;border:none;background:none;cursor:pointer;font-family:inherit;padding:0 0 12px;display:flex;flex-direction:column;align-items:center;gap:9px;">
          <span style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:{{ ab.fg }};">
            {{ ab.label }}
            <span style="font-size:11px;font-weight:800;color:{{ ab.numFg }};background:{{ ab.numBg }};padding:2px 7px;border-radius:7px;">{{ ab.num }}</span>
          </span>
          <span style="width:100%;height:3px;border-radius:3px 3px 0 0;background:{{ ab.linha }};"></span>
        </button>
      </sc-for>
    </div>
  </div>

  <div class="fx-scroll" style="flex:1;overflow-y:auto;overflow-x:hidden;">
    <div style="padding:20px 20px 24px;">

      <!-- ATIVIDADES -->
      <sc-if value="{{ ehAtividades }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-direction:column;gap:12px;">
        <sc-for list="{{ atividades }}" as="a" hint-placeholder-count="3">
          <button style="width:100%;text-align:left;border:1.5px solid {{ a.borda }};background:#fff;border-radius:22px;padding:16px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;gap:13px;">
            <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;width:100%;">
              <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;">
                <span style="font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#5A6873;">{{ a.tipo }}</span>
                <span style="font-size:17px;font-weight:800;color:#14181B;letter-spacing:-.4px;line-height:1.2;">{{ a.titulo }}</span>
              </div>
              <span style="font-size:11px;font-weight:800;color:{{ a.statusFg }};background:{{ a.statusBg }};padding:6px 10px;border-radius:9px;white-space:nowrap;flex-shrink:0;">{{ a.status }}</span>
            </div>

            <div style="display:flex;flex-direction:column;gap:7px;width:100%;">
              <div style="display:flex;align-items:center;justify-content:space-between;">
                <span style="font-size:12px;font-weight:700;color:#2E4756;">{{ a.entregasTexto }}</span>
                <span style="font-size:12px;font-weight:700;color:#5A6873;">{{ a.prazo }}</span>
              </div>
              <div style="height:7px;border-radius:4px;background:#eef0f2;overflow:hidden;">
                <div style="height:100%;border-radius:4px;background:{{ a.barraCor }};width:{{ a.barraLargura }};"></div>
              </div>
            </div>
          </button>
        </sc-for>

        <button style="width:100%;min-height:56px;margin-top:6px;border:1.6px dashed #b9c3cb;border-radius:18px;background:#fff;color:#2E4756;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2E4756" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
          Nova atividade
        </button>
      </div>
      </sc-if>

      <!-- MATERIAIS -->
      <sc-if value="{{ ehMateriais }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;gap:10px;">
        <sc-for list="{{ materiais }}" as="m" hint-placeholder-count="4">
          <div style="display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:13px;">
            <div style="width:44px;height:44px;border-radius:13px;background:{{ m.bg }};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:{{ m.fg }};flex-shrink:0;">{{ m.ext }}</div>
            <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;">
              <div style="font-size:14px;font-weight:700;color:#14181B;">{{ m.nome }}</div>
              <div style="font-size:12px;color:#5A6873;font-weight:600;">{{ m.info }}</div>
            </div>
            <button aria-label="Opções do material" style="width:44px;height:44px;border-radius:12px;border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B7580" stroke-width="2.4"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
            </button>
          </div>
        </sc-for>

        <button style="width:100%;min-height:56px;margin-top:6px;border:1.6px dashed #b9c3cb;border-radius:18px;background:#fff;color:#2E4756;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2E4756" stroke-width="2"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2"/></svg>
          Publicar material
        </button>
      </div>
      </sc-if>

      <!-- ALUNOS -->
      <sc-if value="{{ ehAlunos }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;gap:14px;">
        <div style="display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:0 14px;min-height:50px;border:1.5px solid #e7eaee;">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#6B7580" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></svg>
          <label for="busca-aluno" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">Buscar aluno</label>
          <input id="busca-aluno" type="text" placeholder="Buscar aluno..." style="flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:inherit;font-size:14px;color:#14181B;">
        </div>

        <div style="display:flex;flex-direction:column;gap:8px;">
          <sc-for list="{{ alunos }}" as="al" hint-placeholder-count="5">
            <div style="display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px 14px;">
              <div style="width:40px;height:40px;border-radius:50%;background:{{ al.cor }};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;flex-shrink:0;">{{ al.iniciais }}</div>
              <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;">
                <div style="font-size:14px;font-weight:700;color:#14181B;">{{ al.nome }}</div>
                <div style="font-size:12px;color:#5A6873;font-weight:600;">{{ al.entregas }}</div>
              </div>
              <span style="font-size:12px;font-weight:800;color:{{ al.mediaFg }};">{{ al.media }}</span>
            </div>
          </sc-for>
        </div>
      </div>
      </sc-if>

    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":460,"height":844}}'>
class Component extends DCLogic {
  state = { aba: 'atividades' };

  renderVals() {
    const RED = '#E11D2A', SLATE = '#2E4756', GOLD = '#f0a500', GREEN = '#0a7a3f';
    const atual = this.state.aba;

    const abaDefs = [
      { id: 'atividades', label: 'Atividades', num: '3' },
      { id: 'materiais', label: 'Materiais', num: '8' },
      { id: 'alunos', label: 'Alunos', num: '32' },
    ];
    const abas = abaDefs.map(a => {
      const on = a.id === atual;
      return {
        label: a.label, num: a.num,
        fg: on ? '#fff' : 'rgba(255,255,255,.6)',
        numFg: on ? '#2E4756' : 'rgba(255,255,255,.75)',
        numBg: on ? '#fff' : 'rgba(255,255,255,.16)',
        linha: on ? '#E11D2A' : 'transparent',
        abrir: () => this.setState({ aba: a.id }),
      };
    });

    const atividades = [
      { tipo: 'Lista', titulo: 'Exercícios Pandas & NumPy', prazo: 'Prazo 27 set', status: 'Aberta',
        statusFg: '#2E4756', statusBg: '#eef2f5', borda: '#eceef1',
        entregasTexto: '20 de 32 entregaram', barraCor: SLATE, barraLargura: '62%' },
      { tipo: 'Relatório', titulo: 'Análise Exploratória (EDA)', prazo: 'Encerrada 18 set', status: '12 a avaliar',
        statusFg: '#C8102E', statusBg: '#fdeaec', borda: '#f3d2d5',
        entregasTexto: '30 de 32 entregaram', barraCor: RED, barraLargura: '94%' },
      { tipo: 'Projeto', titulo: 'Projeto final — dataset livre', prazo: 'Prazo 30 out', status: 'Rascunho',
        statusFg: '#8a6d00', statusBg: '#fff3cf', borda: '#eceef1',
        entregasTexto: 'Ainda não publicada', barraCor: '#dfe3e7', barraLargura: '0%' },
    ];

    const materiais = [
      { ext: 'PDF', nome: 'Aula 05 — Regressão Linear.pdf', info: 'PDF · 2.1 MB · 22 set', bg: '#fdeaec', fg: '#C8102E' },
      { ext: 'IPYNB', nome: 'notebook_pandas.ipynb', info: 'Notebook · 340 KB · 20 set', bg: '#eef2f5', fg: '#2E4756' },
      { ext: 'MP4', nome: 'Gravação — aula de 15 set', info: 'Vídeo · 48 min · 15 set', bg: '#e9e2fb', fg: '#5b3fd6' },
      { ext: 'XLS', nome: 'Dataset — vendas regionais.xlsx', info: 'Planilha · 180 KB · 12 set', bg: '#e3f6ec', fg: '#0a7a3f' },
    ];

    const alunos = [
      { iniciais: 'AR', nome: 'Ana Ribeiro', entregas: '6 de 6 entregas', media: '9.1', mediaFg: GREEN, cor: SLATE },
      { iniciais: 'BF', nome: 'Beatriz Fontes', entregas: '6 de 6 entregas', media: '8.8', mediaFg: GREEN, cor: SLATE },
      { iniciais: 'NP', nome: 'Nathalia Prado', entregas: '6 de 6 entregas', media: '8.2', mediaFg: GREEN, cor: SLATE },
      { iniciais: 'VT', nome: 'Vinícius Tomaz', entregas: '4 de 6 entregas', media: '6.2', mediaFg: '#8a6d00', cor: GOLD },
      { iniciais: 'DR', nome: 'Diego Ramos', entregas: '2 de 6 entregas', media: '4.5', mediaFg: '#C8102E', cor: RED },
    ];

    return {
      abas, atividades, materiais, alunos,
      ehAtividades: atual === 'atividades',
      ehMateriais: atual === 'materiais',
      ehAlunos: atual === 'alunos',
    };
  }
}
</script>
</body>
</html>
