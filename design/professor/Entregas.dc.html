<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #C8102E; text-decoration: none; }
    a:hover { color: #E11D2A; }
    .fx-scroll::-webkit-scrollbar { width: 0; height: 0; }
    button:focus-visible { outline: 2.5px solid #2E4756; outline-offset: 3px; }
  </style>
</helmet>

<div style="width:460px;height:844px;background:#F4F5F7;font-family:'Plus Jakarta Sans',system-ui,sans-serif;position:relative;overflow:hidden;display:flex;flex-direction:column;">

  <div class="fx-scroll" style="flex:1;overflow-y:auto;overflow-x:hidden;">

    <!-- cabeçalho -->
    <div style="background:#2E4756;padding:60px 20px 22px;">
      <button aria-label="Voltar para a turma" style="width:44px;height:44px;border-radius:14px;border:none;background:rgba(255,255,255,.16);cursor:pointer;display:flex;align-items:center;justify-content:center;margin-bottom:16px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <span style="font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:rgba(255,255,255,.7);">Lista · Ciência de Dados</span>
      <h1 style="font-size:23px;font-weight:800;color:#fff;margin:6px 0 12px;letter-spacing:-.5px;line-height:1.15;">Exercícios Pandas &amp; NumPy</h1>
      <div style="display:inline-flex;align-items:center;gap:8px;background:rgba(0,0,0,.22);padding:8px 14px;border-radius:12px;font-size:13px;font-weight:700;color:#fff;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        Prazo 27 set, 23:59 · faltam 3 dias
      </div>
    </div>

    <div style="padding:20px;display:flex;flex-direction:column;gap:20px;">

      <!-- resumo -->
      <div style="background:#fff;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;">
        <div style="display:flex;align-items:flex-end;justify-content:space-between;">
          <div style="display:flex;align-items:flex-end;gap:8px;">
            <span style="font-size:32px;font-weight:800;color:#14181B;letter-spacing:-1.4px;line-height:.85;">20</span>
            <span style="font-size:14px;font-weight:700;color:#5A6873;padding-bottom:2px;">de 32 entregaram</span>
          </div>
          <span style="font-size:14px;font-weight:800;color:#2E4756;">62%</span>
        </div>
        <div style="height:9px;border-radius:5px;background:#eef0f2;overflow:hidden;display:flex;">
          <div style="height:100%;background:#0a7a3f;width:56%;"></div>
          <div style="height:100%;background:#f0a500;width:6%;"></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding-top:4px;">
          <div style="display:flex;flex-direction:column;gap:3px;">
            <span style="display:flex;align-items:center;gap:6px;font-size:18px;font-weight:800;color:#0a7a3f;"><span style="width:8px;height:8px;border-radius:50%;background:#0a7a3f;"></span>18</span>
            <span style="font-size:11px;color:#5A6873;font-weight:700;">No prazo</span>
          </div>
          <div style="display:flex;flex-direction:column;gap:3px;">
            <span style="display:flex;align-items:center;gap:6px;font-size:18px;font-weight:800;color:#8a6d00;"><span style="width:8px;height:8px;border-radius:50%;background:#f0a500;"></span>2</span>
            <span style="font-size:11px;color:#5A6873;font-weight:700;">Atrasadas</span>
          </div>
          <div style="display:flex;flex-direction:column;gap:3px;">
            <span style="display:flex;align-items:center;gap:6px;font-size:18px;font-weight:800;color:#C8102E;"><span style="width:8px;height:8px;border-radius:50%;background:#dfe3e7;"></span>12</span>
            <span style="font-size:11px;color:#5A6873;font-weight:700;">Sem entrega</span>
          </div>
        </div>
      </div>

      <!-- filtro -->
      <div style="display:flex;gap:8px;">
        <sc-for list="{{ filtros }}" as="f" hint-placeholder-count="3">
          <button onClick="{{ f.abrir }}" style="flex:1;min-height:44px;border:1.5px solid {{ f.bd }};border-radius:13px;background:{{ f.bg }};color:{{ f.fg }};font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;padding:0 6px;">{{ f.label }}</button>
        </sc-for>
      </div>

      <!-- lista -->
      <div style="display:flex;flex-direction:column;gap:9px;">
        <sc-for list="{{ lista }}" as="e" hint-placeholder-count="6">
          <button style="width:100%;text-align:left;border:1.5px solid {{ e.borda }};background:{{ e.card }};border-radius:18px;padding:13px 14px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:12px;min-height:68px;">
            <div style="width:40px;height:40px;border-radius:50%;background:{{ e.avatarBg }};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:{{ e.avatarFg }};flex-shrink:0;">{{ e.iniciais }}</div>
            <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;">
              <span style="font-size:14px;font-weight:800;color:#14181B;">{{ e.nome }}</span>
              <span style="font-size:12px;color:{{ e.subFg }};font-weight:600;">{{ e.sub }}</span>
            </div>
            <sc-if value="{{ e.temNota }}" hint-placeholder-val="{{ false }}">
              <span style="font-size:15px;font-weight:800;color:#0a7a3f;flex-shrink:0;">{{ e.nota }}</span>
            </sc-if>
            <sc-if value="{{ e.temChip }}" hint-placeholder-val="{{ true }}">
              <span style="font-size:11px;font-weight:800;color:{{ e.chipFg }};background:{{ e.chipBg }};padding:6px 10px;border-radius:9px;white-space:nowrap;flex-shrink:0;">{{ e.chip }}</span>
            </sc-if>
          </button>
        </sc-for>
      </div>

      <!-- ação de contexto -->
      <sc-if value="{{ mostrarCobranca }}" hint-placeholder-val="{{ false }}">
        <button style="width:100%;min-height:54px;border:1.5px solid #cdd3da;border-radius:18px;background:#fff;color:#2E4756;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#2E4756" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          Lembrar os 12 que faltam
        </button>
      </sc-if>

    </div>
  </div>

  <!-- barra de ação -->
  <div style="flex-shrink:0;padding:14px 20px 26px;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid #edeff1;">
    <button style="width:100%;min-height:56px;border:none;border-radius:18px;background:#E11D2A;color:#fff;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 16px 30px -16px rgba(200,16,46,.6);">
      Avaliar as 12 pendentes
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":460,"height":844}}'>
class Component extends DCLogic {
  state = { filtro: 'todos' };

  renderVals() {
    const RED = '#E11D2A', SLATE = '#2E4756', GOLD = '#f0a500';
    const atual = this.state.filtro;

    const filtroDefs = [
      { id: 'todos', label: 'Todos · 32' },
      { id: 'avaliar', label: 'A avaliar · 12' },
      { id: 'faltam', label: 'Sem entrega · 12' },
    ];
    const filtros = filtroDefs.map(f => {
      const on = f.id === atual;
      return {
        label: f.label,
        bg: on ? '#14181B' : '#fff',
        fg: on ? '#fff' : '#2E4756',
        bd: on ? '#14181B' : '#e7eaee',
        abrir: () => this.setState({ filtro: f.id }),
      };
    });

    const base = (o) => ({
      card: '#fff', borda: '#eceef1', avatarFg: '#fff',
      temNota: false, temChip: true, nota: '', ...o,
    });

    const entregues = [
      base({ iniciais: 'AR', nome: 'Ana Ribeiro', sub: 'Entregou 24 set, 20:41', subFg: '#5A6873', avatarBg: SLATE, chip: 'A avaliar', chipFg: '#C8102E', chipBg: '#fdeaec' }),
      base({ iniciais: 'NP', nome: 'Nathalia Prado', sub: 'Entregou 24 set, 21:14', subFg: '#5A6873', avatarBg: SLATE, chip: 'A avaliar', chipFg: '#C8102E', chipBg: '#fdeaec' }),
      base({ iniciais: 'BF', nome: 'Beatriz Fontes', sub: 'Avaliada em 25 set', subFg: '#5A6873', avatarBg: SLATE, temNota: true, temChip: false, nota: '9.0' }),
      base({ iniciais: 'VT', nome: 'Vinícius Tomaz', sub: 'Entregou 26 set, 02:10', subFg: '#8a6d00', avatarBg: GOLD, chip: 'Atrasada', chipFg: '#8a6d00', chipBg: '#fff3cf' }),
    ];

    const faltantes = [
      base({ iniciais: 'DR', nome: 'Diego Ramos', sub: 'Sem entrega', subFg: '#5A6873', avatarBg: '#eef0f2', avatarFg: '#6B7580', card: '#fafbfc', borda: '#e7eaee', temChip: false }),
      base({ iniciais: 'HS', nome: 'Henrique Sarti', sub: 'Sem entrega', subFg: '#5A6873', avatarBg: '#eef0f2', avatarFg: '#6B7580', card: '#fafbfc', borda: '#e7eaee', temChip: false }),
    ];

    let lista = entregues.concat(faltantes);
    if (atual === 'avaliar') lista = entregues.filter(e => e.chip === 'A avaliar' || e.chip === 'Atrasada');
    if (atual === 'faltam') lista = faltantes;

    return { filtros, lista, mostrarCobranca: atual === 'faltam' };
  }
}
</script>
</body>
</html>
