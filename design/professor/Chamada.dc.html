<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #C8102E; text-decoration: none; }
    a:hover { color: #E11D2A; }
    .fx-scroll::-webkit-scrollbar { width: 0; height: 0; }
    button:focus-visible { outline: 2.5px solid #2E4756; outline-offset: 3px; }
  </style>
</helmet>

<div style="width:460px;height:844px;background:#F4F5F7;font-family:'Plus Jakarta Sans',system-ui,sans-serif;position:relative;overflow:hidden;display:flex;flex-direction:column;">

  <!-- cabeçalho -->
  <div style="background:#2E4756;padding:60px 20px 20px;flex-shrink:0;display:flex;flex-direction:column;gap:16px;">
    <div style="display:flex;align-items:center;gap:12px;">
      <button aria-label="Voltar para a turma" style="width:44px;height:44px;border-radius:14px;border:none;background:rgba(255,255,255,.16);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <div style="flex:1;min-width:0;">
        <h1 style="font-size:20px;font-weight:800;color:#fff;margin:0;letter-spacing:-.5px;">Chamada</h1>
        <div style="font-size:12px;color:rgba(255,255,255,.72);font-weight:600;margin-top:2px;">Ciência de Dados · qua, 24 set · 19:00 · Lab 03</div>
      </div>
    </div>

    <!-- contador vivo -->
    <div style="display:flex;align-items:center;gap:14px;background:rgba(0,0,0,.2);border-radius:16px;padding:14px 16px;">
      <div style="display:flex;align-items:baseline;gap:7px;">
        <span style="font-size:26px;font-weight:800;color:#fff;letter-spacing:-1.2px;line-height:1;">{{ presentes }}</span>
        <span style="font-size:12px;font-weight:700;color:rgba(255,255,255,.75);">presentes</span>
      </div>
      <span style="width:1px;height:24px;background:rgba(255,255,255,.2);"></span>
      <div style="display:flex;align-items:baseline;gap:7px;">
        <span style="font-size:26px;font-weight:800;color:{{ corAusentes }};letter-spacing:-1.2px;line-height:1;">{{ ausentes }}</span>
        <span style="font-size:12px;font-weight:700;color:rgba(255,255,255,.75);">ausentes</span>
      </div>
      <span style="flex:1;"></span>
      <sc-if value="{{ podeEditar }}" hint-placeholder-val="{{ true }}">
        <button onClick="{{ limparTudo }}" style="min-height:44px;padding:0 13px;border:1.5px solid rgba(255,255,255,.3);border-radius:12px;background:none;color:#fff;font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer;">Todos presentes</button>
      </sc-if>
    </div>
  </div>

  <!-- instrução -->
  <sc-if value="{{ podeEditar }}" hint-placeholder-val="{{ true }}">
  <div style="flex-shrink:0;padding:14px 20px 4px;display:flex;align-items:center;gap:9px;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A6873" stroke-width="2" style="flex-shrink:0;"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span style="font-size:12.5px;color:#5A6873;font-weight:600;line-height:1.4;">Todos entram como presentes. Toque só em quem faltou.</span>
  </div>
  </sc-if>

  <!-- chamada já salva -->
  <sc-if value="{{ salva }}" hint-placeholder-val="{{ false }}">
  <div style="flex-shrink:0;margin:14px 20px 4px;display:flex;align-items:flex-start;gap:11px;background:#e3f6ec;border:1.5px solid #bfe6d0;border-radius:16px;padding:14px 15px;">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#0a7a3f" stroke-width="2.4" style="flex-shrink:0;margin-top:1px;"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5 11 15l4.5-5"/></svg>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;">
      <span style="font-size:14px;font-weight:800;color:#0a6a37;">Chamada registrada</span>
      <span style="font-size:12.5px;color:#3f7a5a;font-weight:600;line-height:1.4;">Prof. Marcelo Dias · hoje às 20:44. Toda correção fica registrada.</span>
    </div>
  </div>
  </sc-if>

  <!-- lista -->
  <div class="fx-scroll" style="flex:1;overflow-y:auto;overflow-x:hidden;">
    <div style="padding:12px 20px 20px;display:flex;flex-direction:column;gap:8px;">
      <sc-for list="{{ alunos }}" as="a" hint-placeholder-count="8">
        <button onClick="{{ a.alternar }}" aria-label="{{ a.rotulo }}" style="width:100%;text-align:left;min-height:68px;display:flex;align-items:center;gap:12px;background:{{ a.fundo }};border:1.5px solid {{ a.borda }};border-radius:18px;padding:12px 14px;cursor:{{ a.cursor }};font-family:inherit;">
          <span style="width:42px;height:42px;border-radius:50%;background:{{ a.avatarBg }};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:{{ a.avatarFg }};flex-shrink:0;">{{ a.iniciais }}</span>
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;">
            <span style="font-size:14.5px;font-weight:800;color:{{ a.nomeFg }};">{{ a.nome }}</span>
            <sc-if value="{{ a.temSelo }}" hint-placeholder-val="{{ false }}">
              <span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:{{ a.seloFg }};background:{{ a.seloBg }};padding:3px 8px;border-radius:6px;width:fit-content;">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="{{ a.seloFg }}" stroke-width="2.6"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
                {{ a.selo }}
              </span>
            </sc-if>
          </span>
          <span style="display:flex;align-items:center;gap:7px;flex-shrink:0;">
            <span style="font-size:12.5px;font-weight:800;color:{{ a.estadoFg }};">{{ a.estado }}</span>
            <span style="width:30px;height:30px;border-radius:50%;background:{{ a.marcaBg }};border:2px solid {{ a.marcaBd }};display:flex;align-items:center;justify-content:center;">
              <span style="display:flex;color:{{ a.marcaFg }};">{{ a.marca }}</span>
            </span>
          </span>
        </button>
      </sc-for>

      <div style="text-align:center;padding:14px 0 4px;">
        <span style="font-size:12.5px;color:#5A6873;font-weight:700;">e mais 24 alunos</span>
      </div>
    </div>
  </div>

  <!-- barra de ação -->
  <div style="flex-shrink:0;padding:14px 20px 26px;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid #edeff1;">
    <sc-if value="{{ podeEditar }}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ salvar }}" style="width:100%;min-height:56px;border:none;border-radius:18px;background:#E11D2A;color:#fff;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 16px 30px -16px rgba(200,16,46,.6);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M20 6 9 17l-5-5"/></svg>
        Salvar chamada
      </button>
    </sc-if>
    <sc-if value="{{ salva }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ corrigir }}" style="width:100%;min-height:56px;border:1.5px solid #cdd3da;border-radius:18px;background:#fff;color:#2E4756;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#2E4756" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        Corrigir chamada
      </button>
    </sc-if>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":460,"height":844}}'>
class Component extends DCLogic {
  state = { ausentes: { dr: true, hs: true }, salva: false };

  renderVals() {
    const RED = '#E11D2A', SLATE = '#2E4756', GOLD = '#f0a500';
    const faltosos = this.state.ausentes;
    const salva = this.state.salva;
    const podeEditar = !salva;

    // 32 matriculados; a lista mostra 8 e 2 ausentes ficam abaixo da dobra
    const AUSENTES_FORA_DA_LISTA = 2;
    const TOTAL = 32;

    const marcaPresente = React.createElement('svg',
      { width: 15, height: 15, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 3.2, strokeLinecap: 'round', strokeLinejoin: 'round' },
      React.createElement('path', { key: 'p', d: 'M20 6 9 17l-5-5' }));
    const marcaAusente = React.createElement('svg',
      { width: 15, height: 15, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 3.2, strokeLinecap: 'round', strokeLinejoin: 'round' },
      React.createElement('path', { key: 'p', d: 'M18 6 6 18M6 6l12 12' }));

    // faltas anteriores; limite institucional de 25% em 20 aulas = 5 faltas
    const base = [
      { id: 'ar', iniciais: 'AR', nome: 'Ana Ribeiro', faltas: 1, cor: SLATE },
      { id: 'bf', iniciais: 'BF', nome: 'Beatriz Fontes', faltas: 0, cor: SLATE },
      { id: 'dr', iniciais: 'DR', nome: 'Diego Ramos', faltas: 4, cor: RED },
      { id: 'hs', iniciais: 'HS', nome: 'Henrique Sarti', faltas: 3, cor: RED },
      { id: 'jo', iniciais: 'JO', nome: 'Juliana Okano', faltas: 0, cor: SLATE },
      { id: 'np', iniciais: 'NP', nome: 'Nathalia Prado', faltas: 1, cor: SLATE },
      { id: 'rb', iniciais: 'RB', nome: 'Rafael Bueno', faltas: 2, cor: SLATE },
      { id: 'vt', iniciais: 'VT', nome: 'Vinícius Tomaz', faltas: 3, cor: GOLD },
    ];

    const alunos = base.map(a => {
      const ausente = !!faltosos[a.id];
      const total = a.faltas + (ausente ? 1 : 0);
      const noLimite = total >= 5;
      const perto = total === 4;
      return {
        iniciais: a.iniciais, nome: a.nome,
        rotulo: a.nome + (ausente ? ' — marcado como ausente, toque para marcar presente' : ' — presente, toque para marcar falta'),
        fundo: ausente ? '#fdeaec' : '#fff',
        borda: ausente ? '#f3d2d5' : '#eceef1',
        nomeFg: ausente ? '#8f1122' : '#14181B',
        avatarBg: ausente ? '#f7c9ce' : a.cor,
        avatarFg: ausente ? '#8f1122' : '#fff',
        estado: ausente ? 'Faltou' : 'Presente',
        estadoFg: ausente ? '#C8102E' : '#5A6873',
        marca: ausente ? marcaAusente : marcaPresente,
        marcaBg: ausente ? '#C8102E' : '#e3f6ec',
        marcaBd: ausente ? '#C8102E' : '#bfe6d0',
        marcaFg: ausente ? '#fff' : '#0a7a3f',
        temSelo: noLimite || perto,
        selo: noLimite ? (total + 'ª falta · no limite') : (total + 'ª falta · perto do limite'),
        seloFg: noLimite ? '#8f1122' : '#8a6d00',
        seloBg: noLimite ? '#fbdfe3' : '#fff3cf',
        cursor: podeEditar ? 'pointer' : 'default',
        alternar: () => {
          if (!podeEditar) return;
          this.setState({ ausentes: { ...faltosos, [a.id]: !ausente } });
        },
      };
    });

    const ausentesVisiveis = base.filter(a => faltosos[a.id]).length;
    const ausentes = ausentesVisiveis + AUSENTES_FORA_DA_LISTA;

    return {
      alunos, podeEditar, salva,
      presentes: String(TOTAL - ausentes),
      ausentes: String(ausentes),
      corAusentes: ausentes > 0 ? '#ff8a94' : '#fff',
      limparTudo: () => this.setState({ ausentes: {} }),
      salvar: () => this.setState({ salva: true }),
      corrigir: () => this.setState({ salva: false }),
    };
  }
}
</script>
</body>
</html>
