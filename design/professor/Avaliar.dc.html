<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #C8102E; text-decoration: none; }
    a:hover { color: #E11D2A; }
    .fx-scroll::-webkit-scrollbar { width: 0; height: 0; }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2.5px solid #2E4756; outline-offset: 2px; }
  </style>
</helmet>

<div style="width:460px;height:844px;background:#F4F5F7;font-family:'Plus Jakarta Sans',system-ui,sans-serif;position:relative;overflow:hidden;display:flex;flex-direction:column;">

  <!-- cabeçalho com posição na fila -->
  <div style="background:#fff;border-bottom:1px solid #eceef1;padding:56px 20px 14px;flex-shrink:0;display:flex;align-items:center;gap:12px;">
    <button aria-label="Voltar para a lista de entregas" style="width:44px;height:44px;border-radius:14px;border:1.5px solid #eceef1;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2E4756" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <div style="flex:1;min-width:0;text-align:center;">
      <div style="font-size:15px;font-weight:800;color:#14181B;letter-spacing:-.3px;">Avaliando</div>
      <div style="font-size:12px;color:#5A6873;font-weight:700;">2 de 12 pendentes</div>
    </div>
    <div style="width:44px;flex-shrink:0;"></div>
  </div>

  <div class="fx-scroll" style="flex:1;overflow-y:auto;overflow-x:hidden;">
    <div style="padding:20px;display:flex;flex-direction:column;gap:18px;">

      <!-- aluno -->
      <div style="display:flex;align-items:center;gap:13px;">
        <div style="width:52px;height:52px;border-radius:50%;background:#2E4756;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:#fff;flex-shrink:0;">NP</div>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;">
          <span style="font-size:19px;font-weight:800;color:#14181B;letter-spacing:-.4px;">Nathalia Prado</span>
          <span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#0a7a3f;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0a7a3f" stroke-width="2.6"><path d="M20 6 9 17l-5-5"/></svg>
            Entregue 24 set, 21:14 · no prazo
          </span>
        </div>
      </div>

      <!-- arquivo entregue -->
      <div style="background:#fff;border:1.5px solid #eceef1;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;">
        <sc-for list="{{ arquivos }}" as="a" hint-placeholder-count="2">
          <div style="display:flex;align-items:center;gap:12px;">
            <div style="width:46px;height:46px;border-radius:13px;background:{{ a.bg }};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:{{ a.fg }};flex-shrink:0;">{{ a.ext }}</div>
            <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;">
              <span style="font-size:14px;font-weight:700;color:#14181B;">{{ a.nome }}</span>
              <span style="font-size:12px;color:#5A6873;font-weight:600;">{{ a.tam }}</span>
            </div>
            <button aria-label="Baixar {{ a.nome }}" style="width:44px;height:44px;border-radius:13px;border:none;background:#fdeaec;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E11D2A" stroke-width="2.2"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
            </button>
          </div>
        </sc-for>
      </div>

      <!-- nota -->
      <div style="background:#fff;border:1.5px solid #eceef1;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;">
        <label for="campo-nota" style="font-size:12px;font-weight:800;color:#2E4756;letter-spacing:.2px;">Pontos</label>
        <div style="display:flex;align-items:center;gap:12px;">
          <div style="display:flex;align-items:center;gap:6px;background:#F4F5F7;border:1.5px solid #cdd3da;border-radius:16px;padding:0 16px;min-height:58px;flex-shrink:0;">
            <input id="campo-nota" type="text" inputmode="decimal" value="{{ nota }}" placeholder="0,0" style="width:52px;border:none;outline:none;background:transparent;font-family:inherit;font-size:24px;font-weight:800;color:#14181B;text-align:center;">
            <span style="font-size:15px;font-weight:700;color:#5A6873;">/ 10</span>
          </div>
          <div style="flex:1;display:flex;flex-wrap:wrap;gap:6px;">
            <sc-for list="{{ atalhos }}" as="n" hint-placeholder-count="4">
              <button onClick="{{ n.usar }}" style="min-width:52px;min-height:44px;border:1.5px solid {{ n.bd }};border-radius:12px;background:{{ n.bg }};color:{{ n.fg }};font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;">{{ n.label }}</button>
            </sc-for>
          </div>
        </div>
      </div>

      <!-- devolutiva -->
      <div style="background:#fff;border:1.5px solid #eceef1;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;">
        <label for="campo-devolutiva" style="font-size:12px;font-weight:800;color:#2E4756;letter-spacing:.2px;">Devolutiva para o aluno</label>
        <textarea id="campo-devolutiva" rows="4" placeholder="O que ficou bom, o que revisar..." style="width:100%;border:1.5px solid #cdd3da;border-radius:14px;background:#F4F5F7;padding:13px;font-family:inherit;font-size:14px;line-height:1.5;color:#14181B;resize:none;outline:none;">Boa aplicação de groupby e merge. Revise a parte de valores ausentes — a imputação pela média distorceu a distribuição do exercício 4.</textarea>
        <div style="display:flex;align-items:center;gap:8px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6B7580" stroke-width="2" style="flex-shrink:0;"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>
          <span style="font-size:12px;color:#5A6873;font-weight:600;line-height:1.4;">O aluno recebe a nota e a devolutiva por notificação.</span>
        </div>
      </div>

    </div>
  </div>

  <!-- barra de ação -->
  <div style="flex-shrink:0;padding:14px 20px 26px;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid #edeff1;display:flex;gap:10px;">
    <button aria-label="Entrega anterior" style="width:58px;min-height:56px;border:1.5px solid #cdd3da;border-radius:18px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#2E4756" stroke-width="2.2"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <button style="flex:1;min-height:56px;border:none;border-radius:18px;background:#14181B;color:#fff;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;">
      Salvar e ir para o próximo
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":460,"height":844}}'>
class Component extends DCLogic {
  state = { nota: '8,5' };

  renderVals() {
    const atual = this.state.nota;
    const atalhos = ['10', '9,0', '8,0', '7,0'].map(label => {
      const on = label === atual;
      return {
        label,
        bg: on ? '#2E4756' : '#fff',
        fg: on ? '#fff' : '#2E4756',
        bd: on ? '#2E4756' : '#e7eaee',
        usar: () => this.setState({ nota: label }),
      };
    });

    const arquivos = [
      { ext: 'IPYNB', nome: 'lista03_nathalia_prado.ipynb', tam: '412 KB', bg: '#eef2f5', fg: '#2E4756' },
      { ext: 'PDF', nome: 'respostas_comentadas.pdf', tam: '880 KB', bg: '#fdeaec', fg: '#C8102E' },
    ];

    return { atalhos, arquivos, nota: atual };
  }
}
</script>
</body>
</html>
