<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #C8102E; text-decoration: none; }
    a:hover { color: #E11D2A; }
    .fx-scroll::-webkit-scrollbar { width: 0; height: 0; }
    button:focus-visible, input:focus-visible { outline: 2.5px solid #2E4756; outline-offset: 2px; }
  </style>
</helmet>

<div style="width:460px;height:844px;background:#F4F5F7;font-family:'Plus Jakarta Sans',system-ui,sans-serif;position:relative;overflow:hidden;display:flex;flex-direction:column;">

  <div style="background:#fff;border-bottom:1px solid #eceef1;padding:56px 20px 14px;flex-shrink:0;display:flex;align-items:center;gap:12px;">
    <button aria-label="Cancelar e voltar" style="width:44px;height:44px;border-radius:14px;border:1.5px solid #eceef1;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2E4756" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <h1 style="flex:1;font-size:18px;font-weight:800;color:#14181B;margin:0;letter-spacing:-.4px;">Publicar material</h1>
  </div>

  <div class="fx-scroll" style="flex:1;overflow-y:auto;overflow-x:hidden;">
    <div style="padding:20px;display:flex;flex-direction:column;gap:22px;">

      <!-- destino -->
      <div style="display:flex;flex-direction:column;gap:9px;">
        <span style="font-size:12px;font-weight:800;color:#2E4756;letter-spacing:.2px;">Onde vai aparecer</span>
        <div style="background:#fff;border:1.5px solid #eceef1;border-radius:20px;padding:6px;display:flex;flex-direction:column;">
          <sc-for list="{{ destino }}" as="d" hint-placeholder-count="3">
            <button style="width:100%;text-align:left;display:flex;align-items:center;gap:12px;background:none;border:none;cursor:pointer;font-family:inherit;padding:12px 12px;min-height:58px;border-radius:15px;">
              <span style="width:34px;height:34px;border-radius:11px;background:{{ d.bg }};display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{ d.icone }}" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
              </span>
              <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;">
                <span style="font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:#5A6873;">{{ d.nivel }}</span>
                <span style="font-size:15px;font-weight:800;color:#14181B;">{{ d.valor }}</span>
              </span>
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#6B7580" stroke-width="2.2" style="flex-shrink:0;"><path d="M9 6l6 6-6 6"/></svg>
            </button>
          </sc-for>
        </div>
      </div>

      <!-- área de envio -->
      <div style="display:flex;flex-direction:column;gap:9px;">
        <span style="font-size:12px;font-weight:800;color:#2E4756;letter-spacing:.2px;">Arquivos</span>

        <div style="display:flex;flex-direction:column;gap:9px;">
          <sc-for list="{{ arquivos }}" as="a" hint-placeholder-count="2">
            <div style="display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid #eceef1;border-radius:16px;padding:12px 14px;">
              <div style="width:44px;height:44px;border-radius:13px;background:{{ a.bg }};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:{{ a.fg }};flex-shrink:0;">{{ a.ext }}</div>
              <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;">
                <span style="font-size:14px;font-weight:700;color:#14181B;">{{ a.nome }}</span>
                <sc-if value="{{ a.enviando }}" hint-placeholder-val="{{ false }}">
                  <span style="height:5px;border-radius:3px;background:#eef0f2;overflow:hidden;display:block;">
                    <span style="display:block;height:100%;border-radius:3px;background:#2E4756;width:{{ a.progresso }};"></span>
                  </span>
                </sc-if>
                <sc-if value="{{ a.pronto }}" hint-placeholder-val="{{ true }}">
                  <span style="font-size:12px;color:#5A6873;font-weight:600;">{{ a.tam }}</span>
                </sc-if>
              </div>
              <button aria-label="Remover {{ a.nome }}" style="width:44px;height:44px;border-radius:12px;border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B7580" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
              </button>
            </div>
          </sc-for>
        </div>

        <button style="width:100%;min-height:104px;border:1.6px dashed #b9c3cb;border-radius:20px;background:#fff;color:#2E4756;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2E4756" stroke-width="1.9"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2"/></svg>
          <span style="font-size:15px;font-weight:800;">Escolher arquivos</span>
          <span style="font-size:12px;font-weight:600;color:#5A6873;text-align:center;">PDF, slides, planilha, notebook ou vídeo · até 200 MB</span>
        </button>
      </div>

      <!-- avisar a turma -->
      <button onClick="{{ alternarAviso }}" style="width:100%;text-align:left;display:flex;align-items:center;gap:14px;background:#fff;border:1.5px solid {{ avisoBd }};border-radius:18px;padding:15px 16px;cursor:pointer;font-family:inherit;min-height:64px;">
        <span style="width:36px;height:36px;border-radius:12px;background:{{ avisoIconeBg }};display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="{{ avisoIcone }}" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        </span>
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;">
          <span style="font-size:15px;font-weight:800;color:#14181B;">Notificar a turma</span>
          <span style="font-size:12px;color:#5A6873;font-weight:600;">32 alunos recebem um aviso</span>
        </span>
        <span style="width:50px;height:29px;border-radius:20px;background:{{ avisoTgBg }};position:relative;flex-shrink:0;">
          <span style="position:absolute;top:3px;left:{{ avisoTgX }};width:23px;height:23px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);"></span>
        </span>
      </button>

    </div>
  </div>

  <div style="flex-shrink:0;padding:14px 20px 26px;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid #edeff1;">
    <button style="width:100%;min-height:56px;border:none;border-radius:18px;background:#E11D2A;color:#fff;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 16px 30px -16px rgba(200,16,46,.6);">
      Publicar em Aprendizado de Máquina
    </button>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":460,"height":844}}'>
class Component extends DCLogic {
  state = { avisar: true };

  renderVals() {
    const destino = [
      { nivel: 'Curso', valor: 'Ciência de Dados', bg: '#fdeaec', icone: '#C8102E' },
      { nivel: 'Termo', valor: '3º semestre', bg: '#eef2f5', icone: '#2E4756' },
      { nivel: 'Matéria', valor: 'Aprendizado de Máquina', bg: '#eef2f5', icone: '#2E4756' },
    ];

    const arquivos = [
      { ext: 'PDF', nome: 'Aula 06 — Árvores de Decisão.pdf', tam: 'PDF · 3.4 MB', bg: '#fdeaec', fg: '#C8102E', pronto: true, enviando: false, progresso: '100%' },
      { ext: 'IPYNB', nome: 'exemplo_arvores.ipynb', tam: '', bg: '#eef2f5', fg: '#2E4756', pronto: false, enviando: true, progresso: '68%' },
    ];

    const on = this.state.avisar;
    return {
      destino, arquivos,
      alternarAviso: () => this.setState({ avisar: !on }),
      avisoBd: on ? '#2E4756' : '#eceef1',
      avisoIcone: on ? '#2E4756' : '#6B7580',
      avisoIconeBg: on ? '#eef2f5' : '#F4F5F7',
      avisoTgBg: on ? '#2E4756' : '#dfe3e7',
      avisoTgX: on ? '24px' : '3px',
    };
  }
}
</script>
</body>
</html>
