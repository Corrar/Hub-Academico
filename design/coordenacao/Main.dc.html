<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #C8102E; text-decoration: none; }
    a:hover { color: #E11D2A; }
    .fx-scroll::-webkit-scrollbar { width: 0; height: 0; }
    button:focus-visible { outline: 2.5px solid #E11D2A; outline-offset: 2px; }
  </style>
</helmet>

<div style="width:1280px;height:800px;background:#F4F5F7;font-family:'Plus Jakarta Sans',system-ui,sans-serif;display:flex;overflow:hidden;">

  <!-- trilho -->
  <div style="width:248px;flex-shrink:0;background:#2E4756;display:flex;flex-direction:column;padding:24px 14px 18px;">
    <div style="padding:0 10px 22px;">
      <div style="font-size:20px;font-weight:800;letter-spacing:-.9px;color:#fff;line-height:.95;">Fatec</div>
      <div style="font-size:10px;font-weight:800;color:#ff8a94;letter-spacing:-.1px;">Adamantina</div>
      <span style="display:inline-block;margin-top:10px;font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#2E4756;background:#fff;padding:3px 9px;border-radius:6px;">Coordenação</span>
    </div>

    <div style="display:flex;flex-direction:column;gap:2px;flex:1;">
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="8">
        <button style="width:100%;text-align:left;display:flex;align-items:center;gap:11px;min-height:42px;padding:0 10px;border:none;border-radius:11px;background:{{ n.bg }};color:{{ n.fg }};cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:{{ n.peso }};">
          <span style="display:flex;flex-shrink:0;">{{ n.icone }}</span>
          <span style="flex:1;min-width:0;">{{ n.label }}</span>
          <sc-if value="{{ n.temBadge }}" hint-placeholder-val="{{ false }}">
            <span style="font-size:11px;font-weight:800;background:#E11D2A;color:#fff;padding:2px 7px;border-radius:7px;flex-shrink:0;">{{ n.badge }}</span>
          </sc-if>
        </button>
      </sc-for>
    </div>

    <div style="display:flex;align-items:center;gap:10px;padding:12px 10px 0;border-top:1px solid rgba(255,255,255,.14);">
      <div style="width:34px;height:34px;border-radius:50%;background:#E11D2A;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0;">CS</div>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;">
        <span style="font-size:13px;font-weight:700;color:#fff;">Carla Souza</span>
        <span style="font-size:11px;color:rgba(255,255,255,.6);font-weight:600;">Coordenação</span>
      </div>
    </div>
  </div>

  <!-- conteúdo -->
  <div class="fx-scroll" style="flex:1;min-width:0;overflow-y:auto;">
    <div style="padding:30px 32px 36px;display:flex;flex-direction:column;gap:24px;">

      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:20px;">
        <div style="display:flex;flex-direction:column;gap:4px;">
          <h1 style="font-size:25px;font-weight:800;color:#14181B;margin:0;letter-spacing:-.7px;">Visão geral</h1>
          <p style="font-size:14px;color:#5A6873;margin:0;font-weight:500;">Semestre 2026/2 · 4 cursos · 18 turmas · 412 alunos ativos</p>
        </div>
        <div style="display:flex;gap:10px;flex-shrink:0;">
          <button style="min-height:42px;padding:0 16px;border:1.5px solid #dfe4e8;border-radius:12px;background:#fff;color:#2E4756;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#2E4756" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
            Novo evento
          </button>
          <button style="min-height:42px;padding:0 16px;border:none;border-radius:12px;background:#E11D2A;color:#fff;font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:8px;">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
            Novo aviso
          </button>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:20px;align-items:start;">

        <!-- precisa de você -->
        <div style="background:#fff;border:1.5px solid #eceef1;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;">
          <div style="display:flex;align-items:center;gap:9px;">
            <h2 style="font-size:15px;font-weight:800;color:#14181B;margin:0;letter-spacing:-.2px;">Precisa de você</h2>
            <span style="font-size:11px;font-weight:800;color:#C8102E;background:#fdeaec;padding:3px 8px;border-radius:7px;">5</span>
          </div>

          <div style="display:flex;flex-direction:column;gap:10px;">
            <sc-for list="{{ pendencias }}" as="p" hint-placeholder-count="4">
              <div style="display:flex;align-items:flex-start;gap:12px;padding:13px;border:1.5px solid {{ p.borda }};border-radius:14px;background:{{ p.fundo }};">
                <span style="width:32px;height:32px;border-radius:10px;background:{{ p.icoBg }};display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                  <span style="display:flex;color:{{ p.icoFg }};">{{ p.icone }}</span>
                </span>
                <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;">
                  <span style="font-size:13.5px;font-weight:800;color:#14181B;">{{ p.titulo }}</span>
                  <span style="font-size:12.5px;color:#5A6873;font-weight:500;line-height:1.4;">{{ p.detalhe }}</span>
                </div>
                <button style="min-height:34px;padding:0 12px;border:1.5px solid {{ p.acaoBd }};border-radius:10px;background:{{ p.acaoBg }};color:{{ p.acaoFg }};font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer;flex-shrink:0;white-space:nowrap;">{{ p.acao }}</button>
              </div>
            </sc-for>
          </div>
        </div>

        <!-- publicado recentemente -->
        <div style="background:#fff;border:1.5px solid #eceef1;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;">
          <h2 style="font-size:15px;font-weight:800;color:#14181B;margin:0;letter-spacing:-.2px;">Publicado recentemente</h2>

          <div style="display:flex;flex-direction:column;gap:0;">
            <sc-for list="{{ recentes }}" as="r" hint-placeholder-count="5">
              <div style="display:flex;gap:13px;padding:11px 0;border-bottom:1px solid #f1f3f5;">
                <span style="width:8px;height:8px;border-radius:50%;background:{{ r.cor }};margin-top:6px;flex-shrink:0;"></span>
                <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;">
                  <span style="font-size:13.5px;font-weight:700;color:#14181B;line-height:1.35;">{{ r.titulo }}</span>
                  <span style="font-size:12px;color:#5A6873;font-weight:600;">{{ r.autor }} · {{ r.quando }}</span>
                </div>
                <span style="font-size:11px;font-weight:800;color:{{ r.tagFg }};background:{{ r.tagBg }};padding:4px 9px;border-radius:7px;height:fit-content;flex-shrink:0;white-space:nowrap;">{{ r.tag }}</span>
              </div>
            </sc-for>
          </div>
        </div>

      </div>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const RED = '#E11D2A', SLATE = '#2E4756', GOLD = '#f0a500', GREEN = '#0a7a3f';

    const ico = (paths, size) => React.createElement('svg',
      { width: size || 18, height: size || 18, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.9, strokeLinecap: 'round', strokeLinejoin: 'round' },
      paths.map((d, i) => React.createElement('path', { key: i, d })));

    const navDefs = [
      { label: 'Visão geral', ativo: true, paths: ['M3 12h7V3H3zM14 21h7v-9h-7zM14 8h7V3h-7zM3 21h7v-5H3z'] },
      { label: 'Eventos', paths: ['M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z', 'M3 10h18M8 3v4M16 3v4'] },
      { label: 'Avisos', paths: ['M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9', 'M10.3 21a1.94 1.94 0 0 0 3.4 0'] },
      { label: 'Estrutura acadêmica', paths: ['M12 3 3 8l9 5 9-5-9-5z', 'M3 8v6l9 5 9-5V8'] },
      { label: 'Turmas e grade', paths: ['M3 5h18v16H3z', 'M3 10h18M9 10v11M15 10v11'] },
      { label: 'Matrículas', paths: ['M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2', 'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z', 'M19 8v6M22 11h-6'] },
      { label: 'Usuários e papéis', badge: '3', temBadge: true, paths: ['M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2', 'M9.5 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z', 'M16 3.1a4 4 0 0 1 0 7.8'] },
      { label: 'Auditoria', paths: ['M9 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4', 'M8 13h5M8 17h8', 'M14 3h7v7'] },
    ];
    const nav = navDefs.map(n => ({
      label: n.label,
      icone: ico(n.paths),
      bg: n.ativo ? 'rgba(255,255,255,.14)' : 'transparent',
      fg: n.ativo ? '#fff' : 'rgba(255,255,255,.66)',
      peso: n.ativo ? '800' : '600',
      badge: n.badge || '', temBadge: !!n.temBadge,
    }));

    const pendencias = [
      { titulo: '3 pessoas aguardando papel',
        detalhe: 'Ana Paula Reis, Rogério Lima e mais 1 entraram e ainda não têm acesso.',
        icone: ico(['M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2', 'M9.5 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z'], 17),
        icoBg: '#fdeaec', icoFg: '#C8102E', borda: '#f3d2d5', fundo: '#fffafa',
        acao: 'Revisar', acaoBg: '#E11D2A', acaoFg: '#fff', acaoBd: '#E11D2A' },
      { titulo: 'Turma sem grade horária',
        detalhe: 'Empreendedorismo · GC 4º semestre não aparece no cronograma dos alunos.',
        icone: ico(['M12 9v4', 'M12 17h.01', 'M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z'], 17),
        icoBg: '#fff3cf', icoFg: '#8a6d00', borda: '#f0e2b8', fundo: '#fffdf7',
        acao: 'Definir', acaoBg: '#fff', acaoFg: '#8a6d00', acaoBd: '#e5d59a' },
      { titulo: 'Aviso agendado para 10 out',
        detalhe: 'Rematrícula 2027/1 — vai para 412 alunos. Ainda dá para revisar.',
        icone: ico(['M12 8v4l3 2', 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z'], 17),
        icoBg: '#eef2f5', icoFg: '#2E4756', borda: '#eceef1', fundo: '#fff',
        acao: 'Abrir', acaoBg: '#fff', acaoFg: '#2E4756', acaoBd: '#dfe4e8' },
      { titulo: 'Semana de Tecnologia com vagas esgotadas',
        detalhe: '120 de 120 inscritos. 14 pessoas na lista de espera.',
        icone: ico(['M20 6 9 17l-5-5'], 17),
        icoBg: '#e3f6ec', icoFg: '#0a7a3f', borda: '#eceef1', fundo: '#fff',
        acao: 'Abrir', acaoBg: '#fff', acaoFg: '#2E4756', acaoBd: '#dfe4e8' },
    ];

    const recentes = [
      { titulo: 'Aviso: alteração no calendário de provas', autor: 'Carla Souza', quando: 'há 2 horas', cor: RED, tag: 'Institucional', tagFg: '#C8102E', tagBg: '#fdeaec' },
      { titulo: 'Evento: Mercado de Ciência de Dados', autor: 'Carla Souza', quando: 'ontem', cor: SLATE, tag: 'Evento', tagFg: '#2E4756', tagBg: '#eef2f5' },
      { titulo: 'Material: Aula 05 — Regressão Linear', autor: 'Prof. Marcelo Dias', quando: 'há 3 dias', cor: SLATE, tag: 'CD · 3º', tagFg: '#2E4756', tagBg: '#eef2f5' },
      { titulo: 'Atividade: Exercícios Pandas & NumPy', autor: 'Prof. Marcelo Dias', quando: 'há 4 dias', cor: SLATE, tag: 'CD · 3º', tagFg: '#2E4756', tagBg: '#eef2f5' },
      { titulo: 'Turma criada: Empreendedorismo GC 4º', autor: 'Carla Souza', quando: 'há 6 dias', cor: GOLD, tag: 'Estrutura', tagFg: '#8a6d00', tagBg: '#fff3cf' },
    ];

    return { nav, pendencias, recentes };
  }
}
</script>
</body>
</html>
