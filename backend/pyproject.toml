[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hub-academico-api"
version = "0.1.0"
description = "Fundação da API do Hub Acadêmico da Fatec Adamantina"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "SQLAlchemy>=2.0,<3",
  "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "pwdlib[argon2]>=0.2,<1",
  "python-dotenv>=1,<2", "tzdata>=2025",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100


[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
